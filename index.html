<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タスク">
<meta name="theme-color" content="#F7F6F2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>タスク</title>
<!--
  📱 タスク（iPhone のやること帳・1枚もの）

  🔴 外から読み込むものは一切入れない（電波が無い所でも開くため）。
  🔴 このファイルを直したら sw.js の版番号（CACHE = "todo-vN"）を1つ上げること。
  中身の計算は下の LOGIC 部分。tests/test_iphone_todo.py が Task Desk の本物と突き合わせている。
  仕様＝C:\Claude_code\plans\iphone_todo_spec.md ／ 見本＝C:\Claude_code\plans\todo_pwa_mock_v5.html
  配色＝Task Desk（task_desk/ui/style.py）と同じ値。
-->
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE8; --card:#FFFFFF; --ink:#2C2C2A; --ink2:#5F5E5A; --muted:#888780;
  --line:#E4E1D8; --acc:#2F6F4F; --acc-soft:#E3EFE7; --ng:#C0392B; --ng-soft:#FBE7E4;
  --warn:#C97A19; --warn-soft:#FBEEDC; --star:#E0A21E; --ok:#27500A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
/* 🔴 すばやく2回押したときの拡大を止める（スクロール・ピンチは残す）＝☆・↑↓を続けて押すと画面が拡大されて戻らなかった（2026-09-27） */
html{touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Meiryo",sans-serif;font-size:16px;
     -webkit-text-size-adjust:100%;max-width:520px;margin:0 auto;
     /* 🔴 下の切り替えの帯の分＋ホームバーの分を空ける */
     padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* 🔴 入力欄は16px以上＝iPhone は16px未満の入力欄を押すと勝手に拡大して戻らない（2026-09-27） */
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.hide{display:none!important}

/* A 日付の見出し */
#hdr{display:flex;align-items:center;gap:6px;padding:12px 14px 6px}
#hdrTitle{flex:1;font-size:19px;font-weight:bold}
#hdrTitle small{font-size:12px;font-weight:bold;color:#fff;background:var(--acc);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px}
.hbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
/* 見出しを大きく（2026-09-27 ユーザー指定＝今日ボタンは押しやすい目安の高さ44px・緑の縁／日付と「選ぶ」も釣り合うように） */
#hdrTitle{font-size:22px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdrTitle small{font-size:13px;padding:2px 9px}
.hbtn{white-space:nowrap;flex:none}
#goToday{box-sizing:border-box;padding:8px 18px;font-size:17px;font-weight:bold;min-height:44px;border-color:var(--acc);color:var(--acc)}
#selToggle{box-sizing:border-box;padding:6px 12px;font-size:15px;min-height:40px}

/* B 週の日付 */
#strip{display:flex;align-items:center;padding:2px 4px 8px;border-bottom:1px solid var(--line);touch-action:pan-y}
#strip .arr{width:26px;height:44px;color:var(--muted);font-size:18px}
#daysStage{flex:1}
.days{display:flex;justify-content:space-between}
/* めくり：外枠は横のはみ出しだけ隠す（縦はそのまま）・隣の2枚は外枠の中に重ねて置く */
.pgstage{position:relative;overflow-x:hidden;overflow-x:clip;touch-action:pan-y}
.pgpane{position:absolute;top:0;left:0;width:100%;box-sizing:border-box;pointer-events:none}
.d{width:13.5%;text-align:center;font-size:11px;color:var(--muted);border-radius:12px;padding:4px 0 3px}
.d b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.d i{display:block;font-style:normal;font-size:11px;color:var(--warn);height:14px;font-weight:bold}
.d.today b{color:var(--acc)}
.d.on{background:var(--acc);color:#fff}.d.on b,.d.on i{color:#fff}

/* 知らせの帯 */
.bar{margin:8px 12px 0;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5}
.bar.warn{background:var(--warn-soft);color:#7a4a07}
.bar.ng{background:var(--ng-soft);color:var(--ng);font-weight:bold}

/* N 種類で絞る */
#filt{display:flex;gap:6px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none}
#filt::-webkit-scrollbar{display:none}
.f{flex:none;padding:6px 12px;border-radius:16px;font-size:13px;background:var(--bg2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.f.on{background:var(--ink);color:#fff}
.f i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* C ＋ 入れる（右下の丸・下から出るシート・2026-09-30 上の入力欄の代わり） */
#fab{position:fixed;right:max(16px,calc(50vw - 260px + 16px));bottom:calc(72px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;font-size:28px;line-height:44px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.28);z-index:22}
/* ＋と一番下の行の☆が重ならないように、一覧の下に＋の分を空ける／「元に戻す」の帯は＋の横まで */
#dayGroups,#catList{padding-bottom:56px}
body.hasfab #toast{left:max(12px,calc(50vw - 260px + 12px));right:max(68px,calc(50vw - 260px + 68px));max-width:none;margin:0}
#addSheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;z-index:31;padding:12px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.15)}
#addText{width:100%;padding:11px 12px;border:2px solid var(--acc);border-radius:12px;background:var(--card);font-size:16px}
.alb{font-size:12px;font-weight:bold;color:var(--muted);margin:10px 2px 4px}
.apills{display:flex;flex-wrap:wrap;gap:6px}
.ap{position:relative;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:16px;background:var(--card);white-space:nowrap;overflow:hidden}
.ap i{width:9px;height:9px;border-radius:50%;display:inline-block}
.ap.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ap.apimp.on{background:var(--star);border-color:var(--star)}
.ap.off{opacity:.45}
/* 日付の札＝上に透明の日付欄を重ねる（押すと iPhone の日付選びが出る） */
.ap input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
#addSheetMsg{font-size:14px;color:var(--ng);min-height:20px;margin:8px 2px 0;line-height:1.5}
#addSheetMsg.ok{color:var(--acc)}
#addSheet .go{display:flex;gap:8px;margin-top:6px}
#addSheet .go button{flex:1;padding:12px;border-radius:12px;font-weight:bold;font-size:16px}
#addClose{background:var(--bg2)}
#addGo{background:var(--acc);color:#fff}
#addMsg{margin:0 14px 4px;font-size:13px;color:var(--ng);line-height:1.5}
#addMsg.ok{color:var(--acc)}

/* 組と行 */
.gh{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;font-weight:bold;color:var(--ink2);background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:8px}
.gh span{flex:1}
.gh.late{color:var(--ng);background:var(--ng-soft)}
.gh.imphead{color:#fff;background:var(--star);border-color:var(--star);font-size:16px;padding:9px 14px}
.gh.fold{cursor:pointer;color:var(--muted)}
/* 重要を畳む・開く（一番下の横長・2026-09-30） */
.impmore{display:block;width:100%;padding:11px;background:#FFF1CC;color:#8A5C00;font-weight:bold;font-size:15px;border-bottom:1px solid var(--line)}
.gbtn{font-size:12px;border-radius:8px;padding:3px 8px;background:var(--card);border:1px solid currentColor;font-weight:bold}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--card);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row.imp{background:#FFF8E6}   /* 左の縁は外した（見出し・背景・★で足りる・2026-09-27 ユーザー決定） */
.row.pressing{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--acc)}   /* 長押しでメニューが出る合図（並べ替えできない行） */
.row.dragging{box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:5;background:#fff}
.chk{flex:none;width:26px;height:26px;border:2px solid #B8B5AC;border-radius:50%}
.chk.done{background:var(--acc);border-color:var(--acc);position:relative}
.chk.done:after{content:"✓";color:#fff;position:absolute;left:5px;top:0;font-size:16px;font-weight:bold}
.sq{flex:none;width:24px;height:24px;border:2px solid var(--acc);border-radius:6px}
.sq.on{background:var(--acc)}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.t{flex:1;min-width:0}
.t .ti{word-break:break-word;line-height:1.35}
.row.imp .ti{font-weight:bold}
.row.isdone .ti{color:var(--muted);text-decoration:line-through}
.t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.t small .late{color:var(--ng);font-weight:bold}
.tag{font-size:11px;border-radius:8px;padding:0 6px;background:var(--bg2);color:var(--ink2);margin-left:5px;font-weight:normal;white-space:nowrap}
.sent{flex:none;font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:1px 6px}
.star{flex:none;font-size:22px;color:#CFCBC0;width:30px;text-align:center;line-height:1}
.star.on{color:var(--star)}
.mini{flex:none;font-size:12px;border:1px solid var(--acc);color:var(--acc);border-radius:8px;padding:3px 7px}
/* 一覧で開く小項目（2026-09-28）。札は小さいまま、押せる範囲だけ透明の枠で広げる */
.pill{position:relative;display:inline-block;border:1px solid var(--line);border-radius:10px;padding:1px 8px;background:var(--bg2);color:var(--ink2);cursor:pointer;white-space:nowrap}
.pill:after{content:"";position:absolute;left:-8px;right:-8px;top:-4px;bottom:-10px}   /* 上は控えめ＝題名の下の方を押したら詳細画面のまま */
.pill.all{border-color:var(--acc);color:var(--acc)}
.pill.open{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.row.open{flex-wrap:wrap;row-gap:4px}
.row input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}   /* 行は文字選択を止めている＝欄だけ長押しの貼り付けを戻す */
.subx{flex-basis:100%;padding:2px 0 0 46px}
.sxr{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;cursor:pointer}
.sxr .chk{width:22px;height:22px}
.sxr .chk.done:after{left:3px;top:-2px;font-size:14px}
.sxr.done .sxt{color:var(--muted);text-decoration:line-through}
.sxt{word-break:break-word;line-height:1.35}
.sxr.add{color:var(--muted);font-size:14px}
.sxhint{font-size:12px;color:var(--acc);padding:2px 0 4px}
.sxadd{padding:4px 0 6px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}

/* F 選んで送る */
#selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#ECF6EF;border-top:2px solid var(--acc);padding:10px 12px;z-index:20}
#selbar .r{display:flex;align-items:center;gap:8px}
#selCount{flex:1;font-size:14px}
#selSend{background:var(--acc);color:#fff;border-radius:10px;padding:9px 12px;font-weight:bold}
#selSend:disabled{opacity:.45}
#selMsg{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.5}
#selMsg.ng{color:var(--ng);font-weight:bold}

/* 🗂 種類タブ（2026-09-27） */
#catTabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
#catTabs::-webkit-scrollbar{display:none}
.ct{flex:none;padding:7px 12px;border-radius:18px;font-size:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ct i{width:10px;height:10px;border-radius:50%;display:inline-block}
.ct small{color:var(--muted);font-weight:bold;font-size:12px}
.ct.on{background:var(--ink);color:#fff;border-color:var(--ink)}.ct.on small{color:#ddd}
.ct em{width:7px;height:7px;border-radius:50%;background:var(--ng);display:inline-block}
#catMsg{margin:0 14px 4px;font-size:13px;color:var(--ng);line-height:1.5}
#catMsg.ok{color:var(--acc)}
.seg{display:flex;margin:4px 12px 8px;background:var(--bg2);border-radius:10px;padding:3px}
.seg button{flex:1;padding:7px;font-size:14px;border-radius:8px;color:var(--ink2)}
.seg button.on{background:var(--card);font-weight:bold;box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* まとめての操作（一覧・種類タブ共通） */
#selbar .ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#selbar .ops button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 9px;font-size:13px;white-space:nowrap}
#selbar .ops button.ng{color:var(--ng);border-color:#e7b9b3}
#selbar .ops button.armed{background:var(--ng);color:#fff;border-color:var(--ng)}
#selbar .ops button:disabled{opacity:.45}
#selbar .ops button#selSend{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold;padding:7px 9px}
.lnk{font-size:13px;color:var(--acc);text-decoration:underline;padding:4px 2px;white-space:nowrap}
/* 選ぶ中は下の帯が高くなる＝最後の行が帯に隠れないように下を空ける */
body.selecting{padding-bottom:calc(64px + 170px + env(safe-area-inset-bottom))}
#picker{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:80vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;z-index:31;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
#picker b{display:block;font-size:15px;margin:2px 4px 8px}
#picker button.pk{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:6px;font-size:15px}
#picker button.pk i{width:10px;height:10px;border-radius:50%;display:inline-block}
#picker input[type=date]{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:6px;background:var(--card)}

/* H 下の切り替え */
#tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:21}
#tabs button{flex:1;padding:9px 0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
#tabs button b{font-size:20px;font-weight:normal}
#tabs button.on{color:var(--acc);font-weight:bold}

/* 月のカレンダー */
#calHead{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;font-weight:bold;font-size:17px}
#calHead button{width:44px;height:36px;font-size:18px;color:var(--ink2)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 8px}
.cw{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cc{background:var(--card);border-radius:8px;min-height:56px;padding:4px 2px;text-align:center;font-size:14px;border:1px solid transparent}
.cc.other{opacity:.38}
.cc.today{border-color:var(--acc)}
.cc.on{background:var(--acc);color:#fff}
.cc em{display:block;font-style:normal;font-size:11px;font-weight:bold;color:var(--warn);margin-top:3px}
.cc.on em{color:#fff}
#calNote{font-size:12px;color:var(--muted);padding:10px 14px}

/* 設定 */
.sh{padding:16px 14px 6px;font-size:13px;font-weight:bold;color:var(--ink2)}
.sbox{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.srow:last-child{border-bottom:0}
.srow span.k{flex:1}
.srow .v{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:7px 12px;font-size:14px;background:var(--card);white-space:nowrap}
.btn.fill{background:var(--acc);color:#fff}
.btn.ng{border-color:var(--ng);color:var(--ng)}
.btn.armed{background:var(--ng);color:#fff;border-color:var(--ng)}
.btn.mv{padding:7px 10px;margin-right:2px}
.btn:disabled{opacity:.3}
.btn:disabled{opacity:.45}
.sin{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.smsg{padding:6px 14px 0;font-size:13px;line-height:1.5;color:var(--acc)}
.smsg.ng{color:var(--ng);font-weight:bold}
.catedit{padding:10px 14px;border-bottom:1px solid var(--line);background:#FBFAF6}
.swatches{display:flex;gap:8px;margin:10px 0}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.tog{width:50px;height:30px;border-radius:15px;background:#D9D6CC;position:relative;flex:none}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--acc)}.tog.on:after{left:23px}
.foot{padding:16px 14px;color:var(--muted);font-size:12px;line-height:1.7}

/* G 詳細（下から出る） */
#sheetBack{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;z-index:31;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#sheet .top{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
#sheet .top b{flex:1;font-size:16px}
#sheet textarea{width:100%;min-height:72px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;resize:vertical}
.subrow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.subrow .chk{width:22px;height:22px}
.subrow .chk.done:after{left:3px;top:-2px;font-size:14px}
.subrow span{flex:1}
.x{color:var(--muted);font-size:18px;width:30px}

/* ↩ 元に戻す */
#toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;background:#2C2C2A;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:29;font-size:14px}   /* 暗幕(30)・＋のシートより下＝シートの札を塞がない（2026-09-30） */
#toast span{flex:1}
#toast button{color:#9BE3B7;font-weight:bold}
</style>
</head>
<body>

<header id="hdr">
  <div id="hdrTitle"></div>
  <button class="hbtn" id="goToday">今日</button>
  <button class="hbtn" id="selToggle">☑ 選ぶ</button>
</header>

<div id="saveErr" class="bar ng hide">⚠️ 保存できませんでした。いま入れた内容は、アプリを閉じると消えます（iPhone の空き容量を確かめてください）。</div>
<div id="brokenBar" class="bar ng hide"></div>

<section id="listView">
  <div id="strip">

// ── 日付 ────────────────────────────────────────
function pad2(n) { return (n < 10 ? "0" : "") + n; }

// ── 日付の言葉（task_desk/core/dates.py の parse_when の写し）──
var WHEN_WORDS = {
  "今日": "today", "きょう": "today", "today": "today",
  "明日": "tomorrow", "あした": "tomorrow", "あす": "tomorrow", "tomorrow": "tomorrow",
  "週末": "weekend", "今週末": "weekend", "weekend": "weekend",

}

 *  ⚠ 原本は「日曜」「日曜日」を読めない（末尾の 曜・日 を削るとき 日 まで消える）。
 *     こちらは読める。送る文は必ず YYYY-MM-DD にするので PC 側の読み違いは起きない。 */
function parseWhen(word, base) {

  if (!word) return "";

  if (word === "明後日" || word === "あさって") return addDays(base, 2);

// ── 1行の読み方（task_desk/core/inbox.py の parse_line の写し）──
var PRIORITY_WORDS = { "高": 1, "たかい": 1, "high": 1, "!": 1,
                       "低": -1, "ひくい": -1, "low": -1, "通常": 0, "normal": 0 };
/** 入力欄の1行 → { title, due, catName, imp, warnings }。
 *  due は @ が無ければ null（呼び出し側が「今見ている日」か「期限なし」を決める）。
 *  #名前 が種類に無ければ未分類＋一言（勝手に種類を増やさない）。 */

      else warnings.push("種類「" + value + "」はありません（未分類にしました）");

    } else {
      if (PRIORITY_WORDS.hasOwnProperty(value)) pri = PRIORITY_WORDS[value];
      else warnings.push("「!" + value + "」は読めませんでした（重要にしていません）");

    }

    glued.lastIndex = m.index + m[0].length - 1;

// ── 繰り返し（task_desk/core/recurrence.py の next_due の写し）──
var REPEAT_LABEL = { "": "繰り返さない", daily: "毎日", weekly: "毎週", monthly: "毎月" };
/** base の「次」の日。kind が空なら ""。value … weekly=曜日(月0〜日6)／monthly=日付(1〜31) */
function nextDue(kind, value, base) {

}
function repeatText(r) {

  if (r.kind === "daily") return "毎日";
  if (r.kind === "weekly") return "毎週" + WEEKDAY_JP[((+r.value % 7) + 7) % 7] + "曜";
  if (r.kind === "monthly") return "毎月" + (+r.value) + "日";
  return "";
}
/** 繰り返しの次の回の期限。起点は**もとの期限**（遅れて完了しても曜日がズレない）。
 *  次の回が過去になるなら今日以降まで進める（task_desk/core/repositories.py と同じ）。 */
function nextOccurrence(task, today) {

// ── タスクを作る・完了にする ─────────────────────────
function newId(now) { return "t" + now.getTime().toString(36) + Math.random().toString(36).slice(2, 7); }
function makeTask(fields, now) {
  var iso = now.toISOString();
  return {
    id: fields.id || newId(now), title: fields.title, due: fields.due || "",
    cat: fields.cat || "", imp: !!fields.imp,
    autoImp: !!fields.autoImp, autoImpFor: fields.autoImpFor || "",   // 当日になったら⭐（autoImpFor＝自動で見た期限の日・2026-09-30）
    repeat: fields.repeat || { kind: "", value: 0 },
    subs: fields.subs || [], note: fields.note || "",
    done: false, doneAt: "", order: fields.order || 0, sentAt: "",
    createdAt: iso, touchedAt: iso

}
/** 保存データ・控えから読んだタスクの欠けた欄を makeTask と同じ既定値で埋める（あれば変えない）。
 *  🔴 欄が1つ欠けたタスクが1件あるだけで、描画が落ちて画面ごと開けなくなるのを防ぐ。 */
function normalizeTask(t, now) {
  function str(v) { return typeof v === "string" ? v : ""; }
  function when(v) { return typeof v === "string" && !isNaN(new Date(v).getTime()) ? v : ""; }

  t.due = str(t.due); t.cat = str(t.cat); t.note = str(t.note);

  t.repeat = { kind: str(r.kind), value: typeof r.value === "number" && isFinite(r.value) ? r.value : 0 };
  t.subs = (Array.isArray(t.subs) ? t.subs : []).filter(function (s) { return s && typeof s.t === "string"; })
    .map(function (s) { return { t: s.t, done: !!s.done }; });

}
/** 完了にする。繰り返しなら次の回を1件作って返す（今回分は完了として残る）。
 *  小項目は未チェックに戻して引き継ぐ。送信済みの印は引き継がない（次の回はまだ送っていない）。 */

  task.doneAt = now.toISOString();

    // 当日に⭐がオンなら、次の回は⭐なしで作る（その日になったらまた付く）
    title: task.title, due: due, cat: task.cat, imp: task.autoImp ? false : task.imp, autoImp: task.autoImp,
    repeat: { kind: task.repeat.kind, value: task.repeat.value }, note: task.note,
    subs: task.subs.map(function (s) { return { t: s.t, done: false }; }), order: task.order
  }, now);
}

// ── 一覧の組み分け ─────────────────────────────────
function byOrder(a, b) {
  if (a.order !== b.order) return a.order - b.order;
  return a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : 0;
}
function byDueThenOrder(a, b) {
  var x = a.due || "9999", y = b.due || "9999";           // 期限なしは後ろ
  if (x !== y) return x < y ? -1 : 1;
  return byOrder(a, b);
}
/** 今見ている日の一覧を組み分ける。
 *  重要＝日付に関係なく全部（ほかの組には出さない＝二重に出さない）
 *  期限切れ＝今日を見ているときだけ
 *  cat が "" 以外なら、その種類だけ（"none"＝未分類だけ） */
function groupTasks(tasks, viewDay, today, cat) {
  var g = { imp: [], overdue: [], day: [], undated: [], done: [] };
  tasks.forEach(function (t) {
    if (cat === "none" ? t.cat !== "" : (cat && t.cat !== cat)) return;
    if (t.done) { if (t.doneAt && ymd(new Date(t.doneAt)) === viewDay) g.done.push(t); return; }
    if (t.imp) { g.imp.push(t); return; }
    if (!t.due) { g.undated.push(t); return; }
    if (t.due === viewDay) { g.day.push(t); return; }

}

 *  autoImpFor＝その期限の日で一度見た印＝⭐を手で外しても同じ期限の間は付け直さない。期限を変えたら新しい期限の日にまた付く。 */

  tasks.forEach(function (t) {
    if (t.done || !t.autoImp || !t.due || t.due > today || t.autoImpFor === t.due) return;

}
/** 「当日になったら⭐」のスイッチ。🔴 入れ直したら付け直しの対象に戻す（autoImpFor を空に）
 *  ＝⭐を手で外しただけなら同じ期限では付け直さないが、スイッチを入れ直すのは「付けて」という操作（2026-09-30 実機の指摘） */

}

 *  🔴 見えていない同じ組の行（⭐重要を畳んで隠れた分・種類で絞って隠れた分）は**元の位置のまま**残し、
 *     見えていた行が占めていた位置にだけ新しい並びを入れる → 組全体に 10,20,30… を振り直す（番号がぶつからない）。
 *  grp＝"imp"（key＝期限）／"day"（key＝その日）／"undated"。動かした件数を返す。 */
function reorderLane(tasks, grp, key, newIds, nowIso) {

    if (t.imp) return false;
    return grp === "undated" ? !t.due : t.due === key;

  tasks.forEach(function (t) { byId[t.id] = t; });

  // 🔴 選んだまま日・種類・未完了/完了を変えたら選択を外す（見えていない物までまとめて消える・変わるのを防ぐ）

  // 🔴 一覧の中のボタンは描き直しで作り直される＝押し待ちを残すと、見た目は戻ったのに次の1回で確認なしに実行される
  disarm("delDone"); disarm("allToday");
  var d = toDate(V.day);
  el("hdrTitle").innerHTML = V.tab === "list"
    ? esc((d.getMonth() + 1) + "月" + d.getDate() + "日（" + WEEKDAY_JP[weekdayOf(V.day)] + "）") + (V.day === td ? "<small>今日</small>" : "")
    : V.tab === "cat" ? "🗂 " + esc(catLabel(V.catView)) : V.tab === "cal" ? "カレンダー" : "設定";
  paintTodayBtn();
  show("selToggle", V.tab === "list" || V.tab === "cat");
  el("selToggle").classList.toggle("on", V.selecting);
  el("selToggle").textContent = V.selecting ? "✕ やめる" : "☑ 選ぶ";   // 短く＝大きくした日付が切れないように
  document.body.classList.toggle("selecting", V.selecting);
  show("listView", V.tab === "list");
  show("catView", V.tab === "cat");
  show("calView", V.tab === "cal");
  show("setView", V.tab === "set");
  show("selbar", (V.tab === "list" || V.tab === "cat") && V.selecting);
  var fab = (V.tab === "list" || V.tab === "cat") && !V.selecting;   // ＋ は一覧・種類タブだけ・選ぶ中は隠す
  show("fab", fab);
  document.body.classList.toggle("hasfab", fab);
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.classList.toggle("on", b.getAttribute("data-tab") === V.tab);
  });
  if (V.tab === "list") renderList();
  if (V.tab === "cat") renderCat();
  if (V.tab === "cal") renderCal();
  if (V.tab === "set") renderSettings();
}

// ── 一覧 ─────────────────────────────────────
// B 週の日付（sel を含む週・sel に印）。めくるときに隣の週も描くので文字列で返す
function weekHtml(sel) {

    var info = dayInfo(S.tasks, day);

      + WEEKDAY_JP[weekdayOf(day)] + "<b>" + toDate(day).getDate() + "</b><i>"

  }).join("");
}
function renderList() {

/** 下の空いた所でもスワイプできるように、画面の下（タブの上）まで伸ばす（一覧・カレンダー） */
function fitListHeight() { fitToBottom(el("groups")); }

// Q ⭐ 重要（日付に関係なく全部）＝めくっても動かさない
function impHtml() {
  var g = groupTasks(S.tasks, V.day, today(), V.cat);
  var h = [];
  if (g.imp.length) {
    // 畳んでも期限の近い上の数件は見せる＝「重要が消えた？」と迷わない。開閉は一番下の横長ボタン（2026-09-30 ユーザー決定）
    // 選ぶ中は全部見せる（隠れた重要も選べるように）
    var many = g.imp.length > IMP_FOLD_OVER && !V.selecting;

    h.push('<div class="gh imphead"><span>⭐ 重要 ' + g.imp.length + "件</span></div>");
    // 並べ替えの入れ物（同じ期限の行どうしだけ動かせる）
    h.push('<div data-drop="imp">');     // 畳んで一部だけでも並べ替えできる（隠れた行の位置は reorderLane が守る・2026-09-30 実機の指摘）
    shown.forEach(function (t) { h.push(rowHtml(t, { grp: "imp", showDue: true })); });
    h.push("</div>");
    if (many) h.push('<button class="impmore" data-act="impFold">' + (V.impOpen ? "▲ " + IMP_FOLD_SHOW + "件だけにする" : "▼ ほか " + (g.imp.length - IMP_FOLD_SHOW) + "件を見る") + "</button>");

}
// 一覧のうち日によって変わる所（day の日を見ているとき）。めくるときに前日・翌日も描くので文字列で返す
function groupsHtml(day) {
  var td = today();
  var g = groupTasks(S.tasks, day, td, V.cat);
  var h = [];
  // ⚠ 期限切れ（今日を見ているときだけ）
  if (g.overdue.length) {
    h.push('<div class="gh late"><span>⚠ 期限切れ ' + g.overdue.length + '件</span>'
      + (V.selecting ? "" : '<button class="gbtn" data-act="allToday">すべて今日へ</button>') + "</div>");
    g.overdue.forEach(function (t) { h.push(rowHtml(t, { grp: "overdue", showDue: true })); });
  }
  // その日
  h.push('<div class="gh"><span>' + (day === td ? "今日" : shortDate(day)) + " " + g.day.length + "件</span></div>");
  h.push('<div data-drop="day">');
  if (g.day.length) g.day.forEach(function (t) { h.push(rowHtml(t, { grp: "day" })); });
  else h.push('<div class="empty">この日のやることはありません。<br>右下の ＋ で入れられます。</div>');
  h.push("</div>");
  // P 📌 期限なし
  if (g.undated.length) {
    h.push('<div class="gh fold" data-act="undatedFold"><span>' + (V.undatedOpen ? "▼" : "▶") + " 📌 期限なし（いつか）" + g.undated.length + "件</span></div>");
    if (V.undatedOpen) {

      g.undated.forEach(function (t) { h.push(rowHtml(t, { grp: "undated" })); });
      h.push("</div>");

  }
  // E 完了
  if (g.done.length) {
    h.push('<div class="gh fold" data-act="doneFold"><span>' + (V.doneOpen ? "▼" : "▶") + " "
      + (day === td ? "今日" : shortDate(day) + " に") + " 完了した " + g.done.length + "件</span>"
      + (V.selecting ? "" : '<button class="gbtn" data-act="delDone">まとめて消す</button>') + "</div>");
    if (V.doneOpen) g.done.forEach(function (t) { h.push(rowHtml(t, { grp: "done" })); });
  }
  return h.join("");
}

function rowHtml(t, o) {
  var td = today();
  var cat = findCat(S.cats, t.cat);
  var sub = [];
  if (o.showDue && t.due) {
    var late = t.due < td;
    sub.push('<span class="' + (late ? "late" : "") + '">' + (t.due === td ? "今日" : shortDate(t.due)) + "まで</span>");
  } else if (o.showDue) sub.push("期限なし");
  var rep = repeatText(t.repeat);
  if (rep) sub.push("🔁 " + rep);
  if (t.autoImp && !t.imp && t.due && !t.done && t.autoImpFor !== t.due) sub.push("📅→⭐");   // 当日になったら⭐が付く印（手で外した後＝もう付かないので出さない）
  // 小項目＝札を押すとその場で開く（選ぶ中はただの文字・中身も隠す＝選ぶ動作と混ざらないように・2026-09-28）
  var open = false, allDone = false;
  if (t.subs.length) {
    var dn = t.subs.filter(function (s) { return s.done; }).length;
    allDone = dn === t.subs.length;
    var label = "小項目 " + dn + "/" + t.subs.length + (allDone ? " ✓" : "");
    if (V.selecting) sub.push(label);
    else {
      open = !!V.subsOpen[t.id];
      sub.push('<span class="pill' + (open ? " open" : "") + (allDone ? " all" : "") + '" data-act="subsToggle">'
        + (open ? "▼ " : "▶ ") + label + "</span>");
    }
  }
  if ((o.grp === "undated" || o.sleepy) && isSleepy(t, td)) sub.push("💤 " + sleepyDays(t, td) + "日さわっていない");
  if (t.note) sub.push("📝");

  var left, right = "";
  // 選ぶ中は完了・送信済みも選べる（戻す・消すのため。送るときだけ飛ばす＝sendable）
  if (V.selecting) {
    left = '<span class="sq' + (V.selected[t.id] ? " on" : "") + '"></span>';
  } else {
    left = '<button class="chk' + (t.done ? " done" : "") + '" data-act="check" aria-label="完了"></button>';
  }
  if (t.sentAt) right += '<span class="sent">送信済</span>';
  if (!V.selecting && (o.grp === "undated" || o.quick)) {
    right += '<button class="mini" data-act="toToday">今日へ</button><button class="mini" data-act="toTomorrow">明日へ</button>';
  }
  if (!V.selecting && !t.done) {
    right += '<button class="star' + (t.imp ? " on" : "") + '" data-act="star" aria-label="重要">' + (t.imp ? "★" : "☆") + "</button>";
  }
  // 開いた中身は行の内側に置く＝長押しの並べ替えで行と一緒に動く
  return '<div class="row' + (t.imp && !t.done ? " imp" : "") + (t.done ? " isdone" : "") + (open ? " open" : "")
    + '" data-id="' + esc(t.id) + '" data-grp="' + o.grp + '">' + left
    + '<span class="dot" style="background:' + (cat ? cat.color : NONE_COLOR) + '"></span>'
    + '<div class="t"><div class="ti">' + esc(t.title)
    + (cat && (o.tag !== undefined ? o.tag : V.cat === "") ? '<span class="tag">' + esc(cat.name) + "</span>" : "") + "</div>"
    + (sub.length ? "<small>" + sub.join("・") + "</small>" : "") + "</div>" + right
    + (open ? subsHtml(t, allDone) : "") + "</div>";
}
/** 一覧で開いた小項目（チェックと「＋ 足す」だけ。消すのは詳細画面＝丸と ✕ の押し間違いを防ぐ） */
function subsHtml(t, allDone) {
  var h = ['<div class="subx">'];
  t.subs.forEach(function (s, i) {
    h.push('<div class="sxr' + (s.done ? " done" : "") + '" data-act="subChk" data-i="' + i + '"><span class="chk' + (s.done ? " done" : "")
      + '"></span><span class="sxt">' + esc(s.t) + "</span></div>");
  });
  if (allDone && !t.done) h.push('<div class="sxhint">✓ 全部済みました（左の丸を押すと完了）</div>');
  if (V.subAddFor === t.id) {
    h.push('<div class="sxadd"><input class="sin" data-subnew="' + esc(t.id) + '" value="' + esc(V.subDrafts[t.id] || "")
      + '" placeholder="打って Enter で足す" enterkeyhint="done"></div>');

}

// ── 入れる ───────────────────────────────────
/** where＝"cat" なら種類タブの入力欄（今の種類が付く・期限なし）。それ以外は一覧（見ている日・絞っている種類） */
/** ＋ を押した＝下から入力シート。期限・種類の最初の値は今の入力欄と同じ
 *  （一覧＝見ている日・絞っている種類／種類タブ＝期限なし・見ている種類）。打ちかけの文字は前回のまま */
function openAdd() {
  var onCat = V.tab === "cat", here = onCat ? V.catView : V.cat;
  V.adding = true; V.addWhere = V.tab;
  V.add = { due: onCat ? "" : V.day, cat: here && here !== "none" ? here : "", imp: false, autoImp: false };
  el("addText").value = V.addDraft || "";

  renderAddOpts();

}

}
/** 札（期限・種類・⭐・当日に重要）。題名の欄は描き直さない＝キーボードが閉じない */
function renderAddOpts() {
  var a = V.add, td = today(), tm = addDays(td, 1), h = [];
  function pill(on, attrs, label, cls) { return '<button type="button" class="ap' + (cls ? " " + cls : "") + (on ? " on" : "") + '" ' + attrs + ">" + label + "</button>"; }
  var days = [td, tm];
  if (V.addWhere !== "cat" && V.day !== td && V.day !== tm) days.push(V.day);   // 見ている日（今日・明日以外）

  h.push('<div class="alb">期限</div><div class="apills">');
  days.forEach(function (d) { h.push(pill(a.due === d, 'data-ad="due" data-v="' + d + '"', d === td ? "今日" : d === tm ? "明日" : shortDate(d))); });
  h.push('<span class="ap' + (custom ? " on" : "") + '">📅 ' + (custom ? shortDate(a.due) : "日付…") + '<input type="date" id="addDate" aria-label="日付を選ぶ" value="' + (custom ? a.due : "") + '"></span>');
  h.push(pill(!a.due, 'data-ad="due" data-v=""', "📌 なし") + "</div>");
  h.push('<div class="alb">種類</div><div class="apills">');
  h.push(pill(a.cat === "", 'data-ad="cat" data-v=""', '<i style="background:' + NONE_COLOR + '"></i>未分類'));
  S.cats.forEach(function (c) { h.push(pill(a.cat === c.id, 'data-ad="cat" data-v="' + esc(c.id) + '"', '<i style="background:' + c.color + '"></i>' + esc(c.name))); });
  h.push('</div><div class="alb">　</div><div class="apills">');
  h.push(pill(a.imp, 'data-ad="imp"', "⭐ 重要", "apimp"));
  h.push(pill(a.autoImp && !!a.due, 'data-ad="autoImp"', "📅 当日に重要", a.due ? "" : "off"));
  h.push("</div>");
  el("addOpts").innerHTML = h.join("");
}
function onAddOptClick(e) {
  var b = e.target.closest("[data-ad]"); if (!b) return;
  var k = b.getAttribute("data-ad"), a = V.add, msg = el("addSheetMsg");
  msg.textContent = ""; msg.className = "";
  if (k === "due") a.due = b.getAttribute("data-v");
  if (k === "cat") a.cat = b.getAttribute("data-v");
  if (k === "imp") a.imp = !a.imp;
  if (k === "autoImp") {
    if (!a.due) { msg.textContent = "「当日に重要」には期限が要ります（先に期限を選んでください）。"; return; }
    a.autoImp = !a.autoImp;
  }
  renderAddOpts();
}
// ※ キーボードの分だけシートを持ち上げる仕組みは iPhone で効かなかった（2026-09-30 実機）＝外した。
//   入れるのはキーボードの ✓（Enter）で足りる／✓で閉じれば下の「入れる」も見える
/** 入れる。題名の中の @明日 #生活 !高 は札より優先（今までの書き方もそのまま使える）。
 *  入れた後もシートは開いたまま＝続けて打てる。期限・種類は残し、⭐と当日に重要は外す（10件続けて全部⭐になる事故を防ぐ） */
function addFromSheet() {
  var box = el("addText"), msg = el("addSheetMsg"), a = V.add;
  var r = parseInput(box.value, S.cats.map(function (c) { return c.name; }), today());
  msg.className = "";
  if (!r.title) { msg.textContent = r.warnings.length ? r.warnings.join(" / ") : "題名を入れてください。"; box.focus(); return; }
  var cat = a.cat;
  if (r.catName) S.cats.forEach(function (c) { if (c.name === r.catName) cat = c.id; });
  var due = r.due !== null ? r.due : a.due;
  var t = makeTask({ title: r.title, due: due, cat: cat, imp: r.imp || a.imp, autoImp: a.autoImp && !!due, order: nextOrder(due) }, new Date());
  S.tasks.push(t);
  box.value = ""; V.addDraft = "";
  a.imp = false; a.autoImp = false;
  if (!due) V.undatedOpen = true;
  saveAll();                               // ⭐（当日に重要で今日以前）は render の頭で付く
  render();
  renderAddOpts();
  if (r.warnings.length) msg.textContent = "⚠️ 入れました（" + r.warnings.join(" / ") + "）";
  else {
    msg.className = "ok";
    msg.textContent = "✔「" + t.title + "」を入れました（" + (due ? shortDate(due) : "📌 期限なし") + "）";
  }
  box.focus();                             // 「入れる」を押しても欄に戻る＝続けて打てる
}
function nextOrder(due) {
  var m = 0;
  S.tasks.forEach(function (t) { if (!t.done && t.due === due && t.order > m) m = t.order; });
  return m + 10;
}

// ── 完了・元に戻す ──────────────────────────────
var undoState = null;
function doComplete(t) {
  var next = completeTask(t, new Date());
  if (next) {
    S.tasks.push(next); t.spawned = next.id;
    if (V.subsOpen[t.id]) { V.subsOpen[next.id] = true; saveSubsOpen(); }   // 次の回も開いたまま（毎月の買い出しなど）
  }
  delete V.selected[t.id];      // 選んで送る途中に完了にしたものは送らない
  touch(t);
  saveAll();
  render();
  showUndo("✔「" + t.title + "」を完了にしました" + (next ? "（次の回：" + shortDate(next.due) + "）" : ""), [t.id]);
}
function undoComplete(id) {
  var t = taskById(id);
  if (!t) return;
  S.tasks = uncompleteTask(S.tasks, t, nowIso());
  saveAll();
  render();
}
/** 「↩ 元に戻す」の帯。what＝戻す完了の id の配列（まとめて完了なら複数）／{kind:"del", items:[{task, index}]}＝消したもの */
function showUndo(text, what) {
  if (undoState) clearTimeout(undoState.timer);
  el("toastText").textContent = text;
  show("toast", true);
  var st = Array.isArray(what) ? { kind: "done", ids: what } : what;
  st.timer = setTimeout(function () { show("toast", false); undoState = null; }, 5000);
  undoState = st;
}

// ── 一覧の押し分け ──────────────────────────────
function onListClick(e) {
  var act = e.target.closest("[data-act]");
  var row = e.target.closest(".row");
  if (dragJustEnded) { dragJustEnded = false; return; }
  if (act) {
    var a = act.getAttribute("data-act");
    if (a === "impFold") { V.impOpen = !V.impOpen; S.prefs.impOpen = V.impOpen; saveAll(); render(); return; }   // 開き直しても覚える
    if (a === "undatedFold") { V.undatedOpen = !V.undatedOpen; render(); return; }
    if (a === "doneFold") { V.doneOpen = !V.doneOpen; render(); return; }
    if (a === "delDone") {
      var nDone = groupTasks(S.tasks, V.day, today(), V.cat).done.length;
      armOr("delDone", act, "もう一度押すと" + nDone + "件消す", function () {
        var before = S.tasks.length;
        S.tasks = removeDoneOn(S.tasks, V.day, today(), V.cat);
        saveAll(); render();
        el("addMsg").className = "ok"; el("addMsg").textContent = "✔ 完了した" + (before - S.tasks.length) + "件を消しました";
      });
      return;
    }
    if (a === "allToday") {
      armOr("allToday", act, "もう一度押すと全部今日へ", function () {
        var n = moveOverdueToToday(S.tasks, today(), nowIso());
        saveAll(); render();
        el("addMsg").className = "ok"; el("addMsg").textContent = "✔ " + n + "件を今日へ移しました";
      });
      return;
    }
    var t = row && taskById(row.getAttribute("data-id"));
    if (!t) return;
    if (a === "check") {
      if (t.done) { undoComplete(t.id); return; }
      doComplete(t);
      return;
    }
    if (a === "star") { t.imp = !t.imp; touch(t); saveAll(); render(); return; }
    // 小項目をその場で開く・チェック・足す（詳細画面の subChk・subNew と同じ手順）
    if (a === "subsToggle") {
      if (V.subsOpen[t.id]) delete V.subsOpen[t.id]; else V.subsOpen[t.id] = true;
      if (V.subAddFor === t.id) V.subAddFor = null;
      saveSubsOpen(); render();
      return;
    }
    if (a === "subChk") {

// ── 長押し：0.5秒でメニュー／そのまま指を動かすとメニューが消えて並べ替え（iPhone のホーム画面と同じ・2026-09-30 ユーザー決定）──
// 並べ替えは一覧の「その日・期限なし・⭐重要」の中だけ。メニュー（消す・詳細）はどの行でも（期限切れ・完了・種類タブも）

// 🔴 iPhone では長押しでメニュー（暗幕）を出したあと pointermove が届かない疑い（2026-09-30 実機で並べ替えにならなかった）
//    → 指の動きは pointermove と touchmove の両方から受ける（どちらが来ても同じ dragMove）。

    return;
  }

function laneRows(box) {

// ── 選んで送る ─────────────────────────────────
function renderSelCount() {

function sendSelected() {
  var url = S.prefs.hookTask;

  if (!looksLikeWebhook(url)) {
    msg.className = "ng";
    msg.textContent = "先に ⚙ 設定 で「Task Desk への送り先」を貼ってください。";
    return;
  }
  var sb = sendable(S.tasks, V.selected), queue = sb.queue, skipped = sb.skipped;
  if (!queue.length) {
    msg.className = "ng";
    msg.textContent = "送れるもの（まだ送っていない・未完了）がありません。" + (skipped ? "（送信済・完了 " + skipped + "件は送りません）" : "");
    return;
  }
  V.sending = true;
  renderSelCount();
  msg.className = "";
  msg.textContent = "送っています…（" + queue.length + "件）";
  var done = 0;
  function step() {
    if (done >= queue.length) {
      V.sending = false;
      V.selected = {};
      V.selecting = false;
      render();
      el(V.tab === "cat" ? "catMsg" : "addMsg").className = "ok";
      el(V.tab === "cat" ? "catMsg" : "addMsg").textContent = "✅ " + done + "件を Discord まで送りました" + (skipped ? "（送信済・完了 " + skipped + "件は飛ばしました）" : "") + "。Task Desk に入るのは受け取り役（SD Bot）が動いているときです（止まっていても消えず、次に動かしたときに入ります）。";
      return;
    }
    var t = queue[done];
    var line = sendLine(t, S.cats);
    // Discord は1通 2000字まで。超えると毎回断られ、後ろの行も送れなくなる（控えから入った長い題名など）
    if (line.length > SEND_MAX_CHARS) { failSend("「" + t.title.slice(0, 20) + "…」の題名が長すぎて送れません（詳細で短くしてください）。", done); return; }
    post(line, 0);
  }

  function post(line, tries) {
    var t = queue[done];
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: line })
    }).then(function (r) {

          setTimeout(function () { post(line, tries + 1); }, Math.min(Math.max(sec, 0.5), 30) * 1000);

      if (!(r.ok || r.status === 204)) { failSend("送り先が受け取ってくれませんでした（" + r.status + "）。", done); return; }

      t.sentAt = nowIso();
      delete V.selected[t.id];
      saveAll();
      done += 1;
      if (V.tab === "cat") renderCat(); else renderList();

    + " 送れなかった分は選んだまま残してあります。電波のある所でもう一度 📤 を押してください。";

var offState = "";
function paintOffline() { if (el("offMsg")) el("offMsg").textContent = offState; }
function setupOffline() {
  if (location.protocol !== "http:" && location.protocol !== "https:") { offState = "（電波なしで開けるかは、ネット上のアドレスから開くと出ます）"; return; }
  if (!("serviceWorker" in navigator) || !window.caches) { offState = "⚠️ このブラウザでは控えを作れません（電波が要ります）"; return; }
  var tries = 0;
  function look() {
    tries++;
    caches.match("./__offline_ok").then(function (hit) {
      if (hit) return hit.json().then(function (info) {
        offState = "✅ 電波が無くても開けます（" + (info && info.cache ? info.cache : "") + "）"; paintOffline();
      });
      if (tries < 12) { setTimeout(look, 900); return; }
      offState = "⚠️ 電波なし用の控えがまだできていません。電波のある所でもう一度開いてください"; paintOffline();
    }).catch(function () { offState = "⚠️ 電波なし用の控えの状態を確かめられませんでした"; paintOffline(); });
  }
  offState = "⏳ 電波が無くても開けるように準備しています…";
  navigator.serviceWorker.register("./sw.js").then(look).catch(function (err) {
    offState = "⚠️ 電波なし用の控えが作れませんでした（" + (err && err.message ? err.message : "理由不明") + "）"; paintOffline();
  });

    // 🔴 iPhone は指を離した後の click を「その時点で指の下にある物」へ配る＝長押しで出した暗幕に当たってすぐ閉じる
    if (dragJustEnded) return;
    if (!el("picker").classList.contains("hide")) { closePicker(); return; }
    if (V.adding) { closeAdd(); return; }
    closeSheet();
  });
  el("toastUndo").addEventListener("click", function () {
    if (!undoState) return;
    clearTimeout(undoState.timer);
    var st = undoState; undoState = null;
    show("toast", false);
    if (st.kind === "del") {
      // 元の位置へ戻す（まだ無いものだけ＝2回戻さない）
      st.items.forEach(function (it) { if (!taskById(it.task.id)) S.tasks.splice(Math.min(it.index, S.tasks.length), 0, it.task); });
    } else {
      var set = {}; st.ids.forEach(function (i) { set[i] = true; });
      S.tasks = uncompleteMany(S.tasks, set, nowIso()).tasks;
    }
    saveAll(); render();
  });
  // 🔴 日付が変わってから開き直したとき（閉じずに翌日）も「今日」と数字を数え直す
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (V.lastSeen && V.lastSeen !== today() && V.day === V.lastSeen) V.day = today();
    V.lastSeen = today();
    render(); updateBadge();
  });
  V.lastSeen = today();
  render();
  updateBadge();
}

start();
setupOffline();
</script>
</body>
</html>
